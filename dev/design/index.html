<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Respond Design Preview</title>
    <link rel="icon" href="img/brand/appicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,400,0..1,0">
    <style>
        @font-face { font-family: 'Glacial Indifference'; src: url('fonts/GlacialIndifference-Bold.otf'); font-weight: 700; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { display: flex; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #fff; background: #07090d; overflow: hidden; }
        aside { width: 250px; flex: none; height: 100%; overflow-y: auto; padding: 18px 14px; background: linear-gradient(90deg, #0d1117, #141a26); border-right: 1px solid rgba(255,255,255,.08); }
        h1 { font-family: 'Glacial Indifference', sans-serif; font-size: 19px; line-height: 1.1; }
        h1 + p { font-size: 12px; color: #8a93a6; margin: 4px 0 16px; }
        .grp { font-family: 'Glacial Indifference', sans-serif; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8a93a6; margin: 16px 4px 6px; }
        button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
        .pg { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 3px; font-size: 13px; color: #c9cfdb; }
        .pg:hover { background: rgba(255,255,255,.06); }
        .pg.on { background: rgba(54,139,181,.3); color: #fff; }
        .pg.sub { padding-left: 22px; font-size: 12.5px; }
        .seg { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08); }
        .seg button { flex: 1; height: 30px; border-radius: 7px; font-size: 12.5px; font-weight: 700; color: #8a93a6; }
        .seg button.on { background: rgba(255,255,255,.1); color: #fff; }
        .alarm { width: 100%; height: 40px; margin-top: 12px; border-radius: 4px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: #c0191f; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .note { font-size: 11.5px; line-height: 1.45; color: #8a93a6; margin-top: 16px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,.04); }
        main { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 36px; padding: 24px; background: radial-gradient(ellipse at center, #121826, #07090d 75%); }
        .dev { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .dev .cap { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8a93a6; font-family: 'Glacial Indifference', sans-serif; }
        .holder { position: relative; }
        .frame { position: absolute; top: 0; left: 0; transform-origin: top left; background: #000; overflow: hidden; }
        .frame.phone { width: 414px; height: 885px; border-radius: 56px; box-shadow: 0 0 0 9px #050506, 0 0 0 12px #3c4253, 0 30px 80px rgba(0,0,0,.6); }
        .frame.tablet { width: 1024px; height: 768px; border-radius: 32px; box-shadow: 0 0 0 14px #050506, 0 0 0 17px #3c4253, 0 30px 80px rgba(0,0,0,.6); }
        .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
        .notch { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 34px; border-radius: 20px; background: #000; z-index: 5; pointer-events: none; }
        .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.75); z-index: 5; pointer-events: none; }
        .tablet .home { width: 180px; bottom: 7px; }
    </style>
</head>
<body>
    <aside>
        <h1>Incendium Respond</h1>
        <p>Design preview · phone 414 × 885 · tablet 1024 × 768</p>

        <div class="grp">Viewing as</div>
        <div class="seg" id="role"><button data-v="officer" class="on">Officer</button><button data-v="firefighter">Firefighter</button></div>
        <div class="grp">Devices</div>
        <div class="seg" id="devs"><button data-v="both" class="on">Both</button><button data-v="phone">Phone</button><button data-v="tablet">Tablet</button></div>
        <button class="alarm" id="turnout">Trigger turnout</button>

        <div id="pages"></div>

        <div class="note">Everything is clickable. The IRS form is the full DCLG schema (157 questions): later sections appear as you answer section 3 (category, property type, casualties). Sample data otherwise.</div>
    </aside>
    <main id="stage">
        <div class="dev" id="d-phone"><div class="holder"><div class="frame phone"><div class="notch"></div><iframe id="f-phone"></iframe><div class="home"></div></div></div><div class="cap">LB Phone</div></div>
        <div class="dev" id="d-tablet"><div class="holder"><div class="frame tablet"><iframe id="f-tablet"></iframe><div class="home"></div></div></div><div class="cap">LB Tablet</div></div>
    </main>

    <script>
        const PAGES = [
            ['Home', '#/home'],
            ['Status (officers, phone)', '#/status'],
            ['Service Overview', null],
            ['Crewing', '#/overview/crewing', 1],
            ['Incidents in progress', '#/overview/incidents', 1],
            ['Incident detail', '#/overview/incidents/INC-0412', 1],
            ['Risk Information', null],
            ['SSRI / PORIS list', '#/risk/ssri', 1],
            ['SSRI site detail', '#/risk/ssri/S-001', 1],
            ['SSRI edit (tablet)', '#/risk/ssri/S-002/edit', 1],
            ['Hydrants', '#/risk/hydrants', 1],
            ['Knowledge Base', null],
            ['Home', '#/kb', 1],
            ['Search', '#/kb/search', 1],
            ['Article (every element)', '#/kb/article/ba-entry-control', 1],
            ['IRS', null],
            ['Reports list', '#/irs', 1],
            ['New report', '#/irs/new', 1],
            ['Form · 1 Incident Identity', '#/irs/form/IRS-NEW/1', 1],
            ['Form · 2 At Call Details', '#/irs/form/IRS-NEW/2', 1],
            ['Form · 3 On Attendance', '#/irs/form/IRS-NEW/3', 1],
            ['Form · 4 Location', '#/irs/form/IRS-NEW/4', 1],
            ['Form · 5 Additional Info', '#/irs/form/IRS-NEW/5', 1],
            ['Form · 6 Resources Used', '#/irs/form/IRS-NEW/6', 1],
            ['Form · 7 Action', '#/irs/form/IRS-NEW/7', 1],
            ['Form · 8 Damage', '#/irs/form/IRS-NEW/8', 1],
            ['Form · 9 Persons', '#/irs/form/IRS-NEW/9', 1],
            ['Form · Summary', '#/irs/form/IRS-NEW/10', 1],
            ['Blank report', '#/irs/form/IRS-BLANK/1', 1],
            ['Report (read only)', '#/irs/view/IRS-2026-0185', 1],
            ['Report sent', '#/irs/sent/IRS-2026-0188', 1],
            ['Settings (officers, phone)', '#/settings'],
            ['More (phone)', '#/more'],
            ['About', '#/about'],
            ['Shared states', '#/states'],
        ];
        let role = 'officer', devs = 'both', current = '#/home';
        const frames = { phone: document.getElementById('f-phone'), tablet: document.getElementById('f-tablet') };

        function load() {
            for (const d of ['phone', 'tablet']) frames[d].src = `app.html?device=${d}&role=${role}&frame=1${current}`;
        }
        function go(hash) {
            current = hash;
            for (const d of ['phone', 'tablet']) frames[d].contentWindow.postMessage({ type: 'route', route: hash }, '*');
            drawPages();
        }
        function drawPages() {
            document.getElementById('pages').innerHTML = PAGES.map(([label, hash, sub]) => hash
                ? `<button class="pg${sub ? ' sub' : ''}${hash === current ? ' on' : ''}" data-h="${hash}">${label}</button>`
                : `<div class="grp">${label}</div>`).join('');
        }
        function fit() {
            const stage = document.getElementById('stage');
            const show = { phone: devs !== 'tablet', tablet: devs !== 'phone' };
            document.getElementById('d-phone').style.display = show.phone ? '' : 'none';
            document.getElementById('d-tablet').style.display = show.tablet ? '' : 'none';
            const h = stage.clientHeight - 90, w = stage.clientWidth - 100;
            const need = (show.phone ? 414 : 0) + (show.tablet ? 1024 : 0);
            const scale = Math.min(1, h / (show.phone ? 885 : 768), (w - (show.phone && show.tablet ? 36 : 0)) / need);
            for (const [d, fw, fh] of [['phone', 414, 885], ['tablet', 1024, 768]]) {
                const holder = document.querySelector(`#d-${d} .holder`);
                holder.style.width = fw * scale + 'px';
                holder.style.height = fh * scale + 'px';
                holder.firstElementChild.style.transform = `scale(${scale})`;
            }
        }
        document.getElementById('pages').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b) go(b.dataset.h); });
        document.getElementById('role').addEventListener('click', e => {
            const b = e.target.closest('button'); if (!b) return;
            role = b.dataset.v; document.querySelectorAll('#role button').forEach(x => x.classList.toggle('on', x === b)); load();
        });
        document.getElementById('devs').addEventListener('click', e => {
            const b = e.target.closest('button'); if (!b) return;
            devs = b.dataset.v; document.querySelectorAll('#devs button').forEach(x => x.classList.toggle('on', x === b)); fit();
        });
        document.getElementById('turnout').addEventListener('click', () => {
            for (const d of ['phone', 'tablet']) if (d === 'phone') frames[d].contentWindow.postMessage({ type: 'turnout' }, '*');
        });
        window.addEventListener('resize', fit);
        drawPages(); load(); fit();
    </script>
</body>
</html>
